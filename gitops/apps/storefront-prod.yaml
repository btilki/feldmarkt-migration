apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/btilki/feldmarkt-migration.git
      targetRevision: main
      path: charts/storefront
      helm:
        valueFiles:
          - $repo/gitops/envs/prod/storefront.yaml
    - repoURL: https://github.com/btilki/feldmarkt-migration.git
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-prod
  # Manual. Sync after the row check and sequence alignment. Health is checked on the pods this sync starts. DNS waits for that 200.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
