apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront-db-prod
  namespace: storefront-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: storefront-db-prod
  dataFrom:
    - extract:
        key: REPLACE_WITH_PROD_SECRET_ARN
