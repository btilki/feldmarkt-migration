apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront-db-nonprod
  namespace: storefront-dev
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: storefront-db-nonprod
  dataFrom:
    - extract:
        key: REPLACE_WITH_NONPROD_SECRET_ARN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront-db-nonprod
  namespace: storefront-stage
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: storefront-db-nonprod
  dataFrom:
    - extract:
        key: REPLACE_WITH_NONPROD_SECRET_ARN
