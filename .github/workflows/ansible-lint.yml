# Syntax-check and lint the migration runbooks. Does not reach a colo or AWS.
# Does not run freeze or deploy.

name: ansible lint

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.15,<2.19" ansible-lint
      - name: Syntax-check playbooks
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            echo "syntax-check ${playbook}"
            ansible-playbook --syntax-check -i inventory/hosts.example.yml "${playbook}"
          done
      - name: ansible-lint
        run: ansible-lint
